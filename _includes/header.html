<style>
.chHeader {
    position: sticky;
    top: 0;
    z-index: 9000;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 16px;
    padding: 14px 32px;
    background: var(--pink-soft);
    border-bottom: var(--border-w) solid var(--pink-hot);
}

.chHeader__logo {
    font-family: var(--font-pixel);
    font-size: 20px;
    color: var(--pink-hot);
    letter-spacing: .02em;
}
.chHeader__logo::after {
    content: '▌';
    margin-left: 3px;
    animation: chBlink 1s steps(1) infinite;
}
@keyframes chBlink { 50% { opacity: 0; } }

.chNav {
    display: flex;
    align-items: center;
    gap: 10px;
    list-style: none;
    margin: 0;
    padding: 0;
}
.chNav a {
    font-family: var(--font-pixel);
    font-size: 14px;
    padding: 7px 14px;
    background: var(--white);
    border: 2px solid var(--pink-hot);
    box-shadow: 2px 2px 0 var(--pink-hot);
    color: var(--pink-hot);
    transition: none;
}
.chNav a:hover { background: var(--pink-hot); color: var(--white); }
.chNav a:active { transform: translate(2px, 2px); box-shadow: none; }

.chMenuBtn {
    display: none;
    flex-direction: column;
    justify-content: center;
    gap: 4px;
    width: 34px; height: 34px;
    background: var(--white);
    border: 2px solid var(--pink-hot);
    cursor: pointer;
    padding: 4px;
}
.chMenuBtn span { display: block; height: 2px; background: var(--pink-hot); }

.chDrawer {
    position: fixed; inset: 0;
    z-index: 8999;
    background: var(--pink-pale);
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 28px;
    display: none;
}
.chDrawer.is-open { display: flex; }
.chDrawer a {
    font-family: var(--font-pixel);
    font-size: 22px;
    color: var(--pink-hot);
    border: 2px solid var(--pink-hot);
    padding: 10px 24px;
    background: var(--white);
    box-shadow: var(--shadow-hard);
}

@media (max-width: 768px) {
    .chNav { display: none; }
    .chMenuBtn { display: flex; }
}
</style>

<header class="chHeader">
    <a href="{{ '/' | relative_url }}" class="chHeader__logo">★김유진.log</a>

    <nav>
        <ul class="chNav">
            <li><a href="{{ '/project/list.html' | relative_url }}">Works</a></li>
            <li><a href="{{ '/#about' | relative_url }}">About</a></li>
            <li><a href="{{ '/#skills' | relative_url }}">Skills</a></li>
            <li><a href="{{ '/#contact' | relative_url }}">Contact</a></li>
        </ul>
    </nav>

    <button class="chMenuBtn" id="chMenuBtn" aria-label="메뉴 열기" aria-expanded="false" aria-controls="chDrawer">
        <span></span><span></span><span></span>
    </button>
</header>

<nav class="chDrawer" id="chDrawer">
    <a href="{{ '/project/list.html' | relative_url }}">Works</a>
    <a href="{{ '/#about' | relative_url }}">About</a>
    <a href="{{ '/#skills' | relative_url }}">Skills</a>
    <a href="{{ '/#contact' | relative_url }}">Contact</a>
</nav>

<script>
(function () {
    var btn = document.getElementById('chMenuBtn');
    var drawer = document.getElementById('chDrawer');
    if (!btn || !drawer) return;
    btn.addEventListener('click', function () {
        var open = drawer.classList.toggle('is-open');
        btn.setAttribute('aria-expanded', open ? 'true' : 'false');
    });
    drawer.querySelectorAll('a').forEach(function (a) {
        a.addEventListener('click', function () {
            drawer.classList.remove('is-open');
            btn.setAttribute('aria-expanded', 'false');
        });
    });
}());
</script>
